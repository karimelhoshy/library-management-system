name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: shelfwise
          POSTGRES_PASSWORD: shelfwise
          POSTGRES_DB: shelfwise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shelfwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://shelfwise:shelfwise@localhost:5432/shelfwise_test
      # Build-time placeholders; nothing connects during lint/typecheck/test.
      DATABASE_URL: postgres://shelfwise:shelfwise@localhost:5432/shelfwise_test
      AUTH_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
